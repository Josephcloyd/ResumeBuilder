<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F5446" />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/splash.css" />

    <!-- Primary SEO -->
    <title>ResumeFlow – Free Resume Builder &amp; CV Maker with PDF</title>
    <meta
      name="description"
      content="Make a professional resume for free: no sign-up, no watermark. 8 templates, live preview, and PDF download in A4, Letter, Short or Long Bond paper."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="GetLaunch PH" />
    <meta name="application-name" content="ResumeFlow" />
    <link rel="canonical" href="https://resumeflow.getlaunchph.com/" />

    <!-- Icons & install -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Facebook, Messenger, LinkedIn, Viber, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResumeFlow by GetLaunch PH" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:url" content="https://resumeflow.getlaunchph.com/" />
    <meta property="og:title" content="ResumeFlow – Free Resume Builder &amp; CV Maker" />
    <meta
      property="og:description"
      content="Make a professional resume in minutes. Free, no sign-up, no watermark. 8 templates and PDF download, including Short and Long Bond paper."
    />
    <meta property="og:image" content="https://resumeflow.getlaunchph.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ResumeFlow resume editor with live preview on desktop and phone" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ResumeFlow – Free Resume Builder &amp; CV Maker" />
    <meta
      name="twitter:description"
      content="Free, no sign-up, no watermark. 8 templates, live preview, PDF download."
    />
    <meta name="twitter:image" content="https://resumeflow.getlaunchph.com/og-image.jpg" />

    <!-- Structured data for search and AI answer engines (data only, not executed) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.getlaunchph.com/#organization",
            "name": "GetLaunch PH",
            "url": "https://www.getlaunchph.com/",
            "logo": "https://resumeflow.getlaunchph.com/icon-512.png"
          },
          {
            "@type": "WebApplication",
            "@id": "https://resumeflow.getlaunchph.com/#app",
            "name": "ResumeFlow",
            "alternateName": "ResumeFlow by GetLaunch PH",
            "url": "https://resumeflow.getlaunchph.com/",
            "description": "Free online resume builder and CV maker. Create a professional resume with live preview and download it as a PDF in A4, Letter, Short Bond, Long Bond or Legal size. No sign-up and no watermark; resumes are stored only in the user's browser.",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires JavaScript",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "image": "https://resumeflow.getlaunchph.com/og-image.jpg",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PHP" },
            "featureList": [
              "8 resume templates including Simple ATS, Corporate and Fresh Graduate",
              "Live preview while editing",
              "PDF download in A4, Letter, Short Bond, Long Bond and Legal sizes",
              "Resume completeness score with improvement tips",
              "Works on phones and desktops",
              "No sign-up and no watermark",
              "Resumes stay in the browser; import and export as JSON",
              "Dark mode"
            ],
            "publisher": { "@id": "https://www.getlaunchph.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <style>#boot-splash { display: none; }</style>
      <div style="max-width: 640px; margin: 48px auto; padding: 0 20px; font: 17px/1.6 system-ui, sans-serif; color: #17201c;">
        <h1>ResumeFlow – Free Resume Builder &amp; CV Maker</h1>
        <p>ResumeFlow is a free online resume builder by GetLaunch PH. Build your resume with a live preview and download it as a PDF in A4, Letter, Short Bond, Long Bond or Legal size. No sign-up, no watermark.</p>
        <p><strong>Please turn on JavaScript to use the resume builder.</strong> <a href="/about">Read about ResumeFlow and common questions</a>.</p>
      </div>
    </noscript>
    <!-- Boot splash (same emblem as getlaunchph.com); App.tsx fades it out once resumes are loaded -->
    <main id="boot-splash" class="loading-screen" role="status" aria-live="polite" aria-label="Loading ResumeFlow" data-no-pdf>
      <div class="loading-stage">
        <div class="loading-emblem" aria-hidden="true">
          <span class="lm-halo"></span>
          <span class="lm-shadow"></span>
          <span class="lm-orbit"><span class="lm-orbit-arc"></span></span>
          <svg viewBox="0 0 48 48">
            <defs>
              <clipPath id="lm-hex-clip"><path d="M24 2.6 43 13.5c1.2.7 2 2 2 3.4v14.2c0 1.4-.8 2.7-2 3.4L24 45.4 5 34.5a4 4 0 0 1-2-3.4V16.9c0-1.4.8-2.7 2-3.4L24 2.6Z" /></clipPath>
              <linearGradient id="lm-sheen-gradient" x1="0" y1="0" x2="1" y2="0.35">
                <stop offset="0" stop-color="#fff" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff" stop-opacity="0.7" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path class="lm-hex-fill" d="M24 2.6 43 13.5c1.2.7 2 2 2 3.4v14.2c0 1.4-.8 2.7-2 3.4L24 45.4 5 34.5a4 4 0 0 1-2-3.4V16.9c0-1.4.8-2.7 2-3.4L24 2.6Z" fill="currentColor" />
            <path class="lm-hex-line" d="M24 2.6 43 13.5c1.2.7 2 2 2 3.4v14.2c0 1.4-.8 2.7-2 3.4L24 45.4 5 34.5a4 4 0 0 1-2-3.4V16.9c0-1.4.8-2.7 2-3.4L24 2.6Z" pathLength="1" />
            <g class="lm-ink">
              <path class="lm-line lm-trunk" d="M24 38.2V15.8" pathLength="1" />
              <path class="lm-line lm-left" d="M24 32.8h-9.5v-9.1" pathLength="1" />
              <path class="lm-line lm-right" d="M24 29.7h9.8v-7" pathLength="1" />
              <path class="lm-pulse lm-trunk" d="M24 38.2V15.8" pathLength="1" />
              <path class="lm-pulse lm-left" d="M24 32.8h-9.5v-9.1" pathLength="1" />
              <path class="lm-pulse lm-right" d="M24 29.7h9.8v-7" pathLength="1" />
              <circle class="lm-node lm-node-1" cx="24" cy="12.2" r="4.5" />
              <circle class="lm-node lm-node-2" cx="14.5" cy="20.2" r="4.5" />
              <circle class="lm-node lm-node-3" cx="33.8" cy="19.2" r="4.5" />
              <rect class="lm-base" x="19.4" y="35.8" width="9.2" height="6.3" rx="1.9" />
            </g>
            <g clip-path="url(#lm-hex-clip)">
              <rect class="lm-sheen" x="0" y="0" width="14" height="48" fill="url(#lm-sheen-gradient)" />
            </g>
          </svg>
        </div>
        <p class="loading-wordmark" aria-hidden="true"><span class="lm-letter" style="--i:0">R</span><span class="lm-letter" style="--i:1">e</span><span class="lm-letter" style="--i:2">s</span><span class="lm-letter" style="--i:3">u</span><span class="lm-letter" style="--i:4">m</span><span class="lm-letter" style="--i:5">e</span><span class="lm-letter lm-letter-accent" style="--i:6">F</span><span class="lm-letter lm-letter-accent" style="--i:7">l</span><span class="lm-letter lm-letter-accent" style="--i:8">o</span><span class="lm-letter lm-letter-accent" style="--i:9">w</span></p>
        <p class="loading-caption">Preparing your workspace</p>
      </div>
    </main>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
